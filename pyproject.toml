[project]
name = "langgraph-chatbot-framework"
version = "0.1.0"
description = "Framework for Langgraph chatbot development"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.5",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openrouter>=0.11.46",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.3",
    "qdrant-client[fastembed]>=1.19.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
